<div class="shell">

  <nav class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
      @if (!sidebarCollapsed) {
        <span class="app-title">{{ cfg.appTitle }}</span>
      }
    </div>

    <app-main-menu
      [collapsed]="sidebarCollapsed"
      (logoutClicked)="openLogoutModal()"
      (aiClicked)="toggleAiPanel()">
    </app-main-menu>

    <div class="sidebar-footer">
      @if (!sidebarCollapsed) {
        <div class="user-info">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ store.user()?.name }} {{ store.user()?.familyName }}</span>
        </div>
      }
      @if (sidebarCollapsed) {
        <button mat-icon-button (click)="openLogoutModal()" matTooltip="Sign out" matTooltipPosition="right">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </div>
  </nav>

  <main class="canvas">
    <div class="canvas-content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <aside class="ai-panel" [class.open]="aiPanelOpen">
    <div class="ai-panel-header">
      <span class="ai-panel-title">AI Assistant</span>
      <button mat-icon-button (click)="toggleAiPanel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="ai-panel-conversations">
      <button mat-stroked-button class="new-conversation-btn">
        <mat-icon>add</mat-icon>
        New conversation
      </button>
    </div>
    <div class="ai-panel-messages">
      <p class="ai-placeholder">Ask about your nutrition, meals, or ingredients…</p>
    </div>
    <div class="ai-panel-input">
      <mat-form-field appearance="outline" class="ai-input-field">
        <textarea matInput placeholder="Ask something…" rows="2"></textarea>
      </mat-form-field>
      <button mat-icon-button color="primary">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </aside>

</div>
