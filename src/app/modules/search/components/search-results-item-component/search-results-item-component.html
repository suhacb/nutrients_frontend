<div class="result-row" (click)="onClickShow($event)">
  <div class="result-body">
    <span class="result-title">{{ title }}</span>
    @if (description) {
      <span class="result-description">{{ description }}</span>
    }
  </div>
  <mat-icon class="result-arrow">chevron_right</mat-icon>
</div>
