<div class="page-shell">
  <div class="page-header">
    <h1 class="page-title">Diet Tags</h1>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      New tag
    </button>
  </div>

  <table mat-table [dataSource]="store.dietTags()" class="tags-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let tag">
        <span class="tag-name">{{ tag.name }}</span>
        <span class="tag-slug">{{ tag.slug }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let tag" class="description-cell">{{ tag.description ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let tag" class="actions-cell">
        <button mat-icon-button (click)="openEdit(tag)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="confirmDelete(tag)" matTooltip="Delete" class="delete-btn">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (store.dietTags().length === 0) {
    <div class="empty-state">
      <mat-icon>label_off</mat-icon>
      <p>No diet tags yet. Create the first one.</p>
    </div>
  }
</div>
