<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="dialog-message">{{ data.content }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancelClick()">Cancel</button>
  <button mat-flat-button color="warn" (click)="onConfirmClick()">{{ data.confirmLabel ?? 'Confirm' }}</button>
</mat-dialog-actions>
